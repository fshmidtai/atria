name: Atria hive tick

# Пульс роя: бесплатно (2000 минут/мес на private-репо, безлимит на public).
# Каждый запуск = один цикл: сбор → очистка → датасет → сайт + коммит состояния.
#
# ВНИМАНИЕ ручным китай-пушам из локального клон: этот workflow коммитит
# storage/* и colonies/*/dist в master. Локальное рабочее дерево устаревает —
# git add -A МОЛЧА РЕВЕРЁТ эти CI-коммиты. Перед add -A всегда:
#   git fetch && git checkout FETCH_HEAD -- storage colonies/adwatch/dist \
#     colonies/bourse/dist colonies/cveradar/dist colonies/grantsalert/dist \
#     colonies/meridian/dist colonies/phosphor/dist colonies/regpatrol/dist \
#     colonies/sentinel/dist colonies/tenderslice/dist colonies/vesper/dist
on:
  schedule:
    - cron: "17 */4 * * *"   # каждые 4 часа в :17 (6 циклов/сутки)
  workflow_dispatch: {}       # ручной запуск из вкладки Actions

concurrency:
  group: hive-tick
  cancel-in-progress: false

permissions:
  contents: write             # чтобы коммитить состояние обратно в репо

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          pip install -r requirements.txt
          pip install blake3     # хэш-схема ассетов CF Pages (как у wrangler)

      - name: selftest (ядро без сети — сначала здоровье, потом добыча)
        run: python archaea/selftest.py

      - name: soak (12 тиков офлайн — то, что проявляется только во времени)
        run: python archaea/soak.py 12

      - name: run hive cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # поднимает rate-limit GitHub-источника
          HF_TOKEN: ${{ secrets.HF_TOKEN }}           # публикация датасета (опционально)
          HF_STATE_REPO: ${{ secrets.HF_STATE_REPO }} # напр. username/atria-hive-state
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}   # Telegram-бот: подписки + рассылка
        run: python archaea/genesis.py

      - name: commit hive state
        # ВСЕ колонии: git add colonies/*/dist — sentinel/vesper должны уехать в репо
        # так же, как phosphor, иначе их деплой на CF Pages устареет в первый же день.
        # Подписки бота живут в HF-файле tg_subs.json (см. core/tgpost.py),
        # поэтому репозиторный state больше не нужен.
        run: |
          git config user.name "atria-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add colonies/*/dist storage/metrics.json storage/history.jsonl storage/*/exports storage/*/archive.jsonl || true
          if git diff --cached --quiet; then
            echo "нет изменений — спим дальше"
            exit 0
          fi
          git commit -m "hive tick $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: QA gate (публикация вслепую запрещена)
        # После коммита: genesis выходит 0 всегда (рой живёт дальше) — здесь же
        # выносится приговор. Красная джоба = человек смотрит.
        run: python archaea/qa_gate.py

      - name: deploy sites to Cloudflare Pages
        # Каждые 4 часа: QA прошла → все сайты CDN обновляются.
        # blake3 + direct-upload протокол (infra/cloudflare/deploy_pages.py).
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python infra/cloudflare/deploy_pages.py
